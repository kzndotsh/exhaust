[project]
name = "exhaust"
version = "0.1.0"
description = "Agent-first toolkit for security research"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.15",
    "pyyaml>=6.0",
]

[project.scripts]
exhaust = "exhaust.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/exhaust"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
