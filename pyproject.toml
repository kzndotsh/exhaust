[project]
name = "exhaust"
version = "0.1.0"
description = "Agent-first toolkit for security research"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.15",
    "pyyaml>=6.0",
]

[project.scripts]
exhaust = "exhaust.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/exhaust"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "import-linter>=2.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.importlinter]
root_package = "exhaust"

[[tool.importlinter.contracts]]
name = "Domain modules are independent of each other"
type = "independence"
modules = [
    "exhaust.workspace",
    "exhaust.scope_contract",
    "exhaust.catalog",
]

[[tool.importlinter.contracts]]
name = "Domain modules never import the CLI"
type = "forbidden"
source_modules = [
    "exhaust.workspace",
    "exhaust.scope_contract",
    "exhaust.catalog",
]
forbidden_modules = [
    "exhaust.cli",
]
