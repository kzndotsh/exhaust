name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# A pushed branch cancels its own superseded run; a push to main always runs
# to completion so every commit on main ends with a verdict.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --locked --group dev
      - name: Conventional commit messages (PRs only)
        if: github.event_name == 'pull_request'
        run: |
          git log --format=%s "${{ github.event.pull_request.base.sha }}..HEAD" | while read -r subject; do
            printf '%s\n' "$subject" > /tmp/commit-subject.txt
            uv run python scripts/check_commit_message.py /tmp/commit-subject.txt || exit 1
          done
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Docstrings (numpy style)
        run: uv run pydoclint --config=pyproject.toml src
      - name: Strict types
        run: uv run basedpyright
      - name: Tests with coverage
        run: uv run pytest --cov --cov-report=xml
      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false
      - name: Import boundaries are respected
        run: uv run lint-imports
      - name: Vertical catalog is in sync (ADR 0016)
        run: uv run exhaust catalog check
