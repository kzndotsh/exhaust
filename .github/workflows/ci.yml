name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# A pushed branch cancels its own superseded run; a push to main always runs
# to completion so every commit on main ends with a verdict.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
      - name: Install dependencies
        run: uv sync --locked --group dev
      - name: Check commit messages
        if: github.event_name == 'pull_request'
        run: |
          git log --format=%s "${{ github.event.pull_request.base.sha }}..HEAD" | while read -r subject; do
            printf '%s\n' "$subject" > /tmp/commit-subject.txt
            uv run python scripts/check_commit_message.py /tmp/commit-subject.txt || exit 1
          done
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Check docstrings
        run: uv run pydoclint --config=pyproject.toml src
      - name: Type check
        run: uv run basedpyright
      - name: Test
        run: uv run pytest --cov --cov-report=xml
      - name: Upload coverage
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          fail_ci_if_error: false
      - name: Check import boundaries
        run: uv run lint-imports
      - name: Check vertical catalog
        run: uv run exhaust catalog check
